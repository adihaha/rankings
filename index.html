<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fd">
<title>热榜聚合 · 一页看尽全网热点</title>
<style>
/* ============ 设计令牌：现代扁平 + 轻玻璃 ============ */
:root{
  --bg-top:#f6f8fe; --bg-bot:#edf1fb;      /* 浅蓝渐变底 */
  --card:rgba(255,255,255,.86);             /* 轻玻璃卡片 */
  --line:rgba(91,116,230,.12);              /* 细边框 */
  --ink:#232a45; --sub:#7b88a5; --faint:#aab3ca;
  --primary:#5b74e6; --primary-d:#4359cf; --primary-l:#8294f2;
  --soft:rgba(91,116,230,.08);
  --gold:#f5a623; --gold-l:#ffc85c;
  --danger:#e35d6a;
  --r:16px; --r-sm:12px;
  /* 柔和单一阴影（非拟物双向凹凸） */
  --shadow-sm:0 2px 10px rgba(52,74,148,.07),0 1px 3px rgba(52,74,148,.05);
  --shadow:0 12px 32px rgba(52,74,148,.12),0 3px 8px rgba(52,74,148,.06);
  --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);
  min-height:100vh;
  padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 背景装饰光斑（轻玻璃氛围） */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(70px);
  z-index:-1;pointer-events:none;
}
body::before{width:340px;height:340px;background:rgba(91,116,230,.15);top:-130px;right:-100px}
body::after{width:300px;height:300px;background:rgba(245,166,35,.10);bottom:-120px;left:-110px}
a{text-decoration:none;color:inherit}

/* ============ 顶部 Hero ============ */
.hero{
  position:relative;overflow:hidden;
  border-radius:20px;padding:18px 18px 14px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.hero::after{ /* 右上角柔光 */
  content:"";position:absolute;top:-60px;right:-40px;width:200px;height:200px;
  border-radius:50%;background:radial-gradient(closest-side,rgba(91,116,230,.14),transparent);
  pointer-events:none;
}
.hero-top{display:flex;align-items:center;gap:12px}
.hero-badge{
  flex:none;width:44px;height:44px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary-l),var(--primary-d));
  box-shadow:0 6px 16px rgba(91,116,230,.35);
}
.hero-badge svg{width:24px;height:24px}
.hero h1{font-size:20px;font-weight:800;letter-spacing:.5px}
.hero .sub{font-size:12px;font-weight:600;color:var(--sub);margin-top:2px;letter-spacing:.3px}
.refresh-wrap{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.refresh-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  cursor:pointer;background:rgba(255,255,255,.9);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s;
}
.refresh-btn:active{transform:scale(.93)}
.refresh-btn svg{width:18px;height:18px}
.refresh-btn.spin svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.stat{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;
  background:rgba(255,255,255,.75);border:1px solid var(--line);
  font-size:11.5px;font-weight:600;color:var(--sub);white-space:nowrap;
}
.stat b{color:var(--primary);font-size:13px;font-weight:800}
.stat .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--primary-l),var(--primary-d));box-shadow:0 0 0 3px rgba(91,116,230,.16)}
.stat .dot.gold{background:linear-gradient(135deg,var(--gold-l),var(--gold));box-shadow:0 0 0 3px rgba(245,166,35,.16)}

/* ============ 平台选择：紧凑横向滚动 chip 条 ============ */
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:16px 2px 14px;margin:0 -2px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  padding:8px 13px;border-radius:999px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  font-size:12.5px;font-weight:600;color:var(--sub);font-family:inherit;
  transition:all .18s;
}
.chip .cnt{
  font-size:10.5px;font-weight:700;line-height:1;
  padding:3px 6px;border-radius:8px;
  background:var(--soft);color:var(--primary);
}
.chip.empty .cnt{background:rgba(227,93,106,.10);color:var(--danger)}
.chip:active{transform:scale(.96)}
.chip.on{
  background:linear-gradient(135deg,var(--primary-l),var(--primary-d));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(91,116,230,.35);
}
.chip.on .cnt{background:rgba(255,255,255,.24);color:#fff}

/* ============ 榜单 ============ */
#board-head{
  display:flex;align-items:center;gap:10px;margin:6px 2px 12px;
}
#board-head .bar{
  width:4px;height:18px;border-radius:3px;
  background:linear-gradient(180deg,var(--primary-l),var(--primary-d));
  box-shadow:0 2px 6px rgba(91,116,230,.4);
}
#board-head h2{font-size:17px;font-weight:800}
#board-head .meta{font-size:11.5px;font-weight:600;color:var(--faint);margin-left:auto}
.board{display:grid;grid-template-columns:1fr;gap:12px;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.item{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  overflow:hidden;transition:transform .18s,box-shadow .18s;
}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.item:active{transform:scale(.985)}
.item::before{ /* 前3名左侧色条 */
  content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;
  border-radius:0 3px 3px 0;background:transparent;transition:background .2s;
}
.item.top3::before{background:linear-gradient(180deg,var(--primary-l),var(--primary-d))}
.item.n1::before{background:linear-gradient(180deg,var(--gold-l),var(--gold))}
.rank{
  flex:none;width:36px;height:36px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
  background:var(--soft);color:var(--sub);
}
.item.top3 .rank{background:linear-gradient(135deg,var(--primary-l),var(--primary-d));color:#fff}
.item.n1 .rank{
  background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#fff;
  box-shadow:0 5px 14px rgba(245,166,35,.38);
}
.body{flex:1;min-width:0}
.body .t{
  font-size:14px;font-weight:600;line-height:1.5;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;
}
.item.top3 .body .t{font-weight:700}
.hot{
  display:inline-flex;align-items:center;gap:4px;margin-top:5px;
  font-size:11px;font-weight:600;color:var(--faint);
}
.hot svg{width:11px;height:11px;flex:none}
.hot b{color:var(--primary);font-size:11.5px;font-weight:800}
.go{
  flex:none;width:30px;height:30px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.7);border:1px solid var(--line);
  color:var(--faint);transition:color .18s,transform .18s;
}
.go svg{width:13px;height:13px}
.item:hover .go{color:var(--primary);transform:translateX(2px)}

/* ============ 空平台占位 ============ */
.empty{
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  padding:52px 24px;border-radius:var(--r);
  background:var(--card);border:1.5px dashed rgba(91,116,230,.28);
  box-shadow:var(--shadow-sm);
}
.empty .ico{
  width:56px;height:56px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  background:var(--soft);color:var(--primary);
}
.empty .ico svg{width:26px;height:26px}
.empty .t1{font-size:15px;font-weight:800;color:var(--ink)}
.empty .t2{font-size:12px;font-weight:600;color:var(--sub);line-height:1.7}

/* ============ 页脚 ============ */
footer{
  margin-top:26px;text-align:center;
  font-size:11px;font-weight:600;color:var(--faint);line-height:1.9;
}
footer b{color:var(--sub)}

/* ============ 桌面端多列 ============ */
@media(min-width:760px){
  body{padding:32px 32px 44px;max-width:1180px;margin:0 auto}
  .hero{padding:22px 24px 18px;border-radius:22px}
  .hero-badge{width:48px;height:48px}
  .hero h1{font-size:22px}
  .board{grid-template-columns:repeat(2,1fr);gap:14px}
  .item{padding:14px 16px}
  .chips{padding-top:20px}
}
@media(min-width:1120px){
  .board{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

  if(!n || n <= 0) return null;
  if(n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + ' 亿';
  if(n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'') + ' 万';
  return fmt.format(n);
}
function nowStr(){ return new Date().toLocaleString('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }
function todayStr(){ return new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}); }

const platforms = Object.keys(RANKINGS);
const totalItems = platforms.reduce((s,p)=>s+RANKINGS[p].length,0);
let current = null;

/* 平台 chip 条：仅名称 + 条数，横向滚动，不占满 */
function renderChips(){
  const el = $('#chips');
  el.innerHTML = platforms.map((p,i)=>{
    const n = RANKINGS[p].length;
    return `<button class="chip${p===current?' on':''}${n===0?' empty':''}" data-i="${i}">${esc(p)}<span class="cnt">${n}</span></button>`;
  }).join('');
}

function renderBoard(){
  const list = RANKINGS[current] || [];
  const el = $('#board');
  $('#boardTitle').textContent = current;
  if(list.length === 0){
    $('#boardMeta').textContent = '';
    el.innerHTML = `<div class="empty">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
      <div class="t1">暂无数据</div>
      <div class="t2">该平台接口暂未返回数据，<br>可点击右上角刷新按钮重试</div>
    </div>`;
    return;
  }
  $('#boardMeta').textContent = `共 ${list.length} 条 · 点击条目跳转原文`;
  el.innerHTML = list.map((it,i)=>{
    const h = fmtHot(it.hot);
    const cls = i===0 ? 'item top3 n1' : i<3 ? 'item top3' : 'item';
    const flame = h ? `<span class="hot"><svg viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-5 6-5 11a5 5 0 0 0 10 0c0-3-2-5-2-5s1 2 1 4a2.5 2.5 0 0 1-5 0c0-4 5-6 1-10z"/></svg><b>${h}</b></span>` : '';
    return `<a class="${cls}" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">
      <span class="rank">${i+1}</span>
      <span class="body"><span class="t">${esc(it.title)}</span>${flame}</span>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></span>
    </a>`;
  }).join('');
}

function switchTo(name, updateHash){
  if(name === current) return;
  current = name;
  if(updateHash) history.replaceState(null, '', '#' + encodeURIComponent(name));
  renderChips();
  renderBoard();
}

function bindChips(){
  $('#chips').addEventListener('click', e=>{
    const c = e.target.closest('.chip');
    if(c) switchTo(platforms[+c.dataset.i], true);
  });
  window.addEventListener('hashchange', ()=>{
    const h = location.hash.slice(1);
    if(h && platforms.includes(decodeURIComponent(h))) switchTo(decodeURIComponent(h), false);
  });
}

async function refresh(){
  const btn = $('#refreshBtn');
  btn.classList.add('spin');
  try{
    const r = await fetch('./data.json', {cache:'no-store'});
    if(r.ok){
      const fresh = await r.json();
      Object.keys(RANKINGS).forEach(k=>delete RANKINGS[k]);
      Object.assign(RANKINGS, fresh);
    }
  }catch(e){ /* file:// 或离线：继续使用内嵌数据 */ }
  const ts = nowStr();
  $('#updTime').textContent = ts;
  $('#updTime2').textContent = ts;
  renderChips(); renderBoard();
  setTimeout(()=>btn.classList.remove('spin'), 700);
}

/* ============ 初始化 ============ */
$('#statDate').textContent = todayStr();
$('#statPlat').textContent = platforms.length;
$('#statItem').textContent = totalItems;
let init = platforms[0];
try{
  const h = location.hash.slice(1);
  if(h && platforms.includes(decodeURIComponent(h))) init = decodeURIComponent(h);
}catch(e){ /* 非法 hash 忽略 */ }
current = init;
renderChips(); renderBoard();
const ts = nowStr();
$('#updTime').textContent = ts;
$('#updTime2').textContent = ts;
bindChips();
$('#refreshBtn').addEventListener('click', refresh);
</script>
</body>
</html>
